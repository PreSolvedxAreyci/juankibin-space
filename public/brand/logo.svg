<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="juankibin logo">
  <defs>
    <linearGradient id="jkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0c0c10"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.85"/>
  <!-- Abstract orbital arc -->
  <path d="M28 86 C36 48, 92 36, 100 72" fill="none" stroke="url(#jkGrad)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <!-- JK mark -->
  <g filter="url(#softGlow)" fill="url(#jkGrad)" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="-2">
    <text x="64" y="78" text-anchor="middle">JK</text>
  </g>
  <!-- Amber accent dot -->
  <circle cx="98" cy="34" r="5" fill="#f59e0b"/>
</svg>
